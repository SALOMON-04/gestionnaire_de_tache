info:
  name: Find one task
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/tasks/{{taskId}}"
  headers:
    - name: Authorization
      value: Bearer{{token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("token", res.getBody().id);
    - type: tests
      code: |-
        test("status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("champs clés présents", function () {
          const task = res.getBody();
          expect(task).to.have.property("id");
          expect(task).to.have.property("title");
          expect(task).to.have.property("priority");
          expect(task).to.have.property("completed");
        });

        test("id correspond à la tâche demandée", function () {
          expect(res.getBody().id).to.equal(Number(bru.getEnvVar("taskId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
